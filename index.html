<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>สแกนเช็ค</title>
<!-- ร่างหน้าสแกนเช็ค (ฟอร์ม ① ส่งเช็ค) · อ่านรูปบนมือถือเท่านั้น ไม่ส่งรูปออกไปที่ไหน -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--mute:#667085;--line:#d0d5dd;--acc:#1456f0;--warn:#b54708;--ok:#067647}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Sukhumvit Set","Noto Sans Thai",sans-serif}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.step{font-size:13px;color:var(--mute);margin-bottom:6px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:10px;font-size:17px;font-weight:600;background:var(--acc);color:#fff;text-align:center;cursor:pointer}
.btn.sec{background:#fff;color:var(--acc);border:1px solid var(--acc)}
.btn:disabled{opacity:.5}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select{width:100%;padding:12px;font-size:17px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.hint{font-size:13px;color:var(--mute)}
.chk{font-size:13px;color:var(--warn)}
.okk{font-size:13px;color:var(--ok)}
img#pv{width:100%;border-radius:8px;margin-top:10px;display:none}
.bar{height:6px;background:#e4e7ec;border-radius:3px;overflow:hidden;margin-top:10px;display:none}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
#review{display:none}
</style>
</head>
<body>
<main>
<h1>📷 สแกนเช็ค → ส่งเช็ค</h1>

<div class="card">
  <div class="step">ขั้นที่ 1</div>
  <label for="cam" class="btn">ถ่ายรูปเช็ค</label>
  <input id="cam" type="file" accept="image/*" capture="environment" hidden>
  <p class="hint">วางเช็คบนโต๊ะ ถ่ายตรง ๆ ให้<b>เช็คเต็มจอ</b> เห็นแถบตัวเลขด้านล่างชัด · ถ่ายเช็คตัวจริง ไม่ถ่ายจากหน้าจอ</p>
  <img id="pv" alt="รูปเช็ค">
  <div class="bar" id="bar"><i></i></div>
  <p class="hint" id="st"></p>
</div>

<div class="card" id="review">
  <div class="step">ขั้นที่ 2 · ตรวจและแก้ให้ถูกก่อนกดยืนยัน</div>
  <label for="no">เลขที่เช็ค</label>
  <input id="no" inputmode="numeric" autocomplete="off">
  <div id="noN" class="chk"></div>

  <label for="amt">จำนวนเงิน (บาท)</label>
  <input id="amt" inputmode="decimal" autocomplete="off">
  <div id="amtN" class="chk"></div>

  <label for="bank">ธนาคาร</label>
  <select id="bank"></select>
  <div id="bankN" class="chk"></div>

  <label for="payer">ผู้สั่งจ่าย</label>
  <select id="payer"></select>
  <div class="hint">ระบบยังอ่านชื่อผู้สั่งจ่ายไม่ได้ กดเลือกเอง</div>

  <div style="height:16px"></div>
  <button class="btn" id="go">ยืนยัน → เปิดฟอร์มส่งเช็ค</button>
  <p class="hint">ฟอร์มจะเปิดพร้อมข้อมูลที่กรอกไว้ · <b>แนบรูปเช็คอีกครั้งในฟอร์ม</b> แล้วกดส่ง</p>
  <button class="btn sec" id="again" style="margin-top:8px">ถ่ายใหม่</button>
</div>
</main>

<script>
const FORM = "https://ujpzitc70et6.jp.larksuite.com/share/base/shrjpWkaC5DNj54uJTvQwigYrhc";
// ชื่อคำถามในฟอร์ม (ทดสอบแล้ว: prefill ด้วยชื่อคำถามใช้ได้)
const Q = {no:"เลขที่เช็ค", amt:"จำนวนเงิน (บาท)", bank:"ธนาคาร", payer:"ผู้สั่งจ่าย"};
// รหัสธนาคาร 3 หลักในแถบ MICR → ตัวเลือกในฟอร์ม
const BANKS = {
 "002":"ธนาคารกรุงเทพ (BBL)","004":"ธนาคารกสิกรไทย (KBank)","006":"ธนาคารกรุงไทย (KTB)",
 "011":"ธนาคารทหารไทยธนชาต (ttb)","014":"ธนาคารไทยพาณิชย์ (SCB)","017":"ซิตี้แบงก์ (Citibank)",
 "022":"ธนาคารซีไอเอ็มบี ไทย (CIMB Thai)","024":"ธนาคารยูโอบี (UOB)","025":"ธนาคารกรุงศรีอยุธยา (Krungsri)",
 "030":"ธนาคารออมสิน (GSB)","031":"ธนาคารเอชเอสบีซี (HSBC)","034":"ธนาคารเพื่อการเกษตรและสหกรณ์การเกษตร (ธ.ก.ส.)",
 "067":"ธนาคารทิสโก้ (TISCO)","069":"ธนาคารเกียรตินาคินภัทร (KKP)","070":"ธนาคารไอซีบีซี (ไทย) (ICBC)",
 "073":"ธนาคารแลนด์ แอนด์ เฮ้าส์ (LH Bank)"
};
const BANK_OPTS = [...new Set(Object.values(BANKS))].concat("ธนาคารอื่น ๆ (Other)");
const PAYERS = ["AIA","เมืองไทยประกันชีวิต (Muang Thai Life)","ไทยประกันชีวิต (Thai Life)","FWD ประกันชีวิต",
 "อลิอันซ์ อยุธยา (Allianz Ayudhya)","กรุงไทย-แอกซ่า (Krungthai-AXA)","ไทยประกันสุขภาพ (Thai Health Insurance)",
 "กรุงเทพประกันภัย (Bangkok Insurance)","เมืองไทยประกันภัย (Muang Thai Insurance)","ทิพยประกันภัย (Dhipaya)",
 "วิริยะประกันภัย (Viriyah)","ชับบ์ไลฟ์ (Chubb Life)","เจนเนอราลี่ (Generali)","โตเกียวมารีน (Tokio Marine)",
 "เอ็ม เอส ไอ จี (MSIG)","อื่น ๆ (ระบุ)"];
const $ = id => document.getElementById(id);
const fill = (sel, opts) => { sel.innerHTML = '<option value="">— เลือก —</option>' + opts.map(o=>`<option>${o}</option>`).join(''); };
fill($('bank'), BANK_OPTS); fill($('payer'), PAYERS);

let wEng, wMicr;
const prog = m => { if (m.status === 'recognizing text') $('bar').firstChild.style.width = Math.round(m.progress*100)+'%'; };
async function workers(){
  if (!wEng) wEng = await Tesseract.createWorker('eng', 1, {logger: prog});
  // ไฟล์ฝึกอ่านฟอนต์ MICR (E-13B) วางไว้ข้างหน้าเว็บ · A=⑆ B=⑇ C=⑈ D=⑉
  if (!wMicr) wMicr = await Tesseract.createWorker('e13b', 1, {logger: prog, langPath: new URL('.', location.href).href, gzip: false});
  return [wEng, wMicr];
}

// ขาวดำ + ขยายให้กว้างอย่างน้อย 2000px
function gray(src, sx=0, sy=0, sw=src.naturalWidth||src.width, sh=src.naturalHeight||src.height, minW=2000){
  const k = Math.max(1, minW/sw), W = Math.min(4000, Math.round(sw*k)), H = Math.round(sh*W/sw);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(src, sx, sy, sw, sh, 0, 0, W, H);
  const d = g.getImageData(0,0,W,H), p = d.data; let lo = 255, hi = 0;
  for (let i=0;i<p.length;i+=4){ const y = .299*p[i]+.587*p[i+1]+.114*p[i+2]; p[i]=y; if (y<lo) lo=y; if (y>hi) hi=y; }
  const r = 255/Math.max(1, hi-lo);
  for (let i=0;i<p.length;i+=4){ const y = (p[i]-lo)*r; p[i]=p[i+1]=p[i+2]=y; }
  g.putImageData(d,0,0); return c;
}
const crop = (c, b, padY=0.6, padX=0.02) => {
  const h = b.y1-b.y0, x0 = Math.max(0, b.x0 - c.width*padX), y0 = Math.max(0, b.y0 - h*padY);
  const x1 = Math.min(c.width, b.x1 + c.width*padX), y1 = Math.min(c.height, b.y1 + h*padY);
  return gray(c, x0, y0, x1-x0, y1-y0, 2400);
};
const digits = s => (s.match(/\d/g)||[]).length;

// แถบ MICR เช็คไทย: …[เลขที่เช็ค]⑈ [ธนาคาร 3]⑆[สาขา 4]⑈ [เลขบัญชี]…
function parseMicr(t){
  const s = t.replace(/\s+/g,'');
  let m = s.match(/(\d{7,8})[A-D]+(\d{3})[A-D]+(\d{4})/);            // เลขเช็ค ⑈ ธนาคาร ⑆ สาขา
  if (m && BANKS[m[2]]) return {no: m[1], bank: m[2]};
  m = s.match(/(\d{7,8})\D{0,3}(\d{3})\D{0,3}\d{4}/);
  if (m && BANKS[m[2]]) return {no: m[1], bank: m[2]};
  const runs = s.split(/[^0-9]+/).filter(Boolean);
  let no = null, bank = null;
  for (let i=0;i<runs.length;i++){
    const r = runs[i];
    if (!bank && (r.length===3 || r.length===7) && BANKS[r.slice(0,3)] && i>0) { bank = r.slice(0,3); for (let j=i-1;j>=0;j--) if (runs[j].length===7||runs[j].length===8){ no = runs[j]; break; } break; }
  }
  if (!no) no = runs.find(r => r.length===7 || r.length===8) || null;
  return {no, bank};
}

// ยอดเงิน: เลขแบบ 310,826.59 (มี , หรือ . และทศนิยม 2 ตำแหน่ง) เลือกค่าที่มากสุด
function parseAmount(t){
  const m = t.replace(/[Oo]/g,'0').replace(/(\d)\s*([,.])\s*(\d)/g,'$1$2$3').match(/\d{1,3}(?:,\d{3})+(?:\.\d{2})?|\d{3,9}\.\d{2}/g) || [];
  const v = m.map(x=>parseFloat(x.replace(/,/g,''))).filter(x=>x>=1 && x<1e9);
  return v.length ? Math.max(...v) : null;
}

$('cam').addEventListener('change', e => { const f = e.target.files[0]; if (f) run(URL.createObjectURL(f)); });
async function run(url){
  const img = $('pv');
  img.src = url; img.style.display = 'block';
  await img.decode();
  $('review').style.display = 'none';
  $('bar').style.display = 'block'; $('bar').firstChild.style.width = '0';
  $('st').textContent = 'กำลังอ่านเช็ค… (ครั้งแรกอาจใช้เวลา 10–30 วินาที)';
  let raw = '';
  try {
    const [we, wm] = await workers(), full = gray(img);
    // 1) อ่านทั้งรูป หาแถวแถบ MICR (แถวที่มีตัวเลขมากที่สุด) และแถวยอดเงิน
    const r1 = (await we.recognize(full, {}, {blocks: true})).data;
    const lines = (r1.blocks||[]).flatMap(b => b.paragraphs.flatMap(p => p.lines));
    const micrLine = lines.filter(l => digits(l.text) >= 12).sort((a,b) => digits(b.text)-digits(a.text))[0];
    let micr = '';
    if (micrLine){ micr = (await wm.recognize(crop(full, micrLine.bbox))).data.text; }
    else { micr = (await wm.recognize(gray(img, 0, img.naturalHeight*0.75, img.naturalWidth, img.naturalHeight*0.25))).data.text; }
    let {no, bank} = parseMicr(micr);
    if (!no || !bank){ const p2 = parseMicr(r1.text); no = no || p2.no; bank = bank || p2.bank; }
    if (!bank){ // รหัสธนาคาร 3 หลักตามด้วยสาขา 4 หลัก เช่น 004:1234
      for (const m of r1.text.matchAll(/(\d{3})\s*[:;|\-]?\s*\d{4}\b/g)) if (BANKS[m[1]]) { bank = m[1]; break; } }
    // 1b) ถ้าเช็คเล็กในรูป (ถ่ายไกล/มีของอื่นติดมา) ตัดเฉพาะตัวเช็คจากตำแหน่งแถบ MICR แล้วอ่านใหม่
    let src = full, rr = r1, ls = lines;
    if (micrLine){
      const b = micrLine.bbox, mw = b.x1 - b.x0;
      if (mw < full.width*0.7){
        const cw = mw/0.85, x0 = Math.max(0, b.x0 - cw*0.08), y1 = Math.min(full.height, b.y1 + cw*0.04), y0 = Math.max(0, y1 - cw*0.5);
        src = gray(full, x0, y0, Math.min(full.width - x0, cw*1.08), y1 - y0, 2400);
        rr = (await we.recognize(src, {}, {blocks: true})).data;
        ls = (rr.blocks||[]).flatMap(b => b.paragraphs.flatMap(p => p.lines));
        raw += 'CROP>> ' + rr.text + '\n';
      }
    }
    // 2) ยอดเงิน: อ่านซ้ำเฉพาะแถวที่น่าจะเป็นยอดเงิน (มี *** / ฿ / ตัวเลขมีจุดทศนิยม) แบบขยายใหญ่
    const micrInSrc = ls.filter(l => digits(l.text) >= 12).sort((a,b) => digits(b.text)-digits(a.text))[0];
    let amt = parseAmount(ls.filter(l => l !== micrInSrc).map(l => l.text).join('\n'));
    const amtLines = ls.filter(l => l !== micrInSrc && /\*{2,}|฿|\d[.,]\d{2}\b/.test(l.text));
    await we.setParameters({tessedit_char_whitelist: '0123456789,.*'});
    for (const l of amtLines){ const t = (await we.recognize(crop(src, l.bbox, 0.4, 0))).data.text; raw += 'AMT>> '+t+'\n'; const v = parseAmount(t); if (v && (!amt || v > amt)) amt = v; }
    await we.setParameters({tessedit_char_whitelist: ''});
    if (!amt && src !== full) amt = parseAmount(lines.filter(l => l !== micrLine).map(l => l.text).join('\n'));
    raw += 'MICR>> ' + micr + '\nALL>> ' + r1.text;
    show(no, amt, bank);
  } catch(err){
    raw += 'ERR ' + err;
    $('st').textContent = 'อ่านไม่สำเร็จ กรอกเองได้ด้านล่าง'; show(null,null,null);
  }
  $('bar').style.display = 'none';
}

function note(id, ok, okText, noText){ const n=$(id); n.className = ok?'okk':'chk'; n.textContent = ok?okText:noText; }
function show(no, amt, bank){
  $('no').value = no || ''; $('amt').value = amt!=null ? amt.toFixed(2) : '';
  $('bank').value = bank ? BANKS[bank] : '';
  note('noN', no, 'อ่านได้ · เทียบกับตัวเลขบนเช็คอีกครั้ง', 'อ่านไม่ได้ · พิมพ์เอง');
  note('amtN', amt!=null, 'อ่านได้ · ถ้าเป็นเช็คเขียนมือ ตรวจให้ดี', 'อ่านไม่ได้ · พิมพ์เอง');
  note('bankN', bank, 'เลือกให้จากรหัสธนาคารในแถบตัวเลขล่าง', 'อ่านไม่ได้ · เลือกเอง');
  $('st').textContent = 'อ่านเสร็จ ตรวจข้อมูลด้านล่าง';
  $('review').style.display = 'block'; $('review').scrollIntoView({behavior:'smooth'});
}

$('go').addEventListener('click', () => {
  const no = $('no').value.replace(/\D/g,''), amt = $('amt').value.replace(/[^\d.]/g,'');
  if (!no){ alert('กรอกเลขที่เช็คก่อน'); $('no').focus(); return; }
  const q = new URLSearchParams();
  q.set('prefill_'+Q.no, no);
  if (amt) q.set('prefill_'+Q.amt, amt);
  if ($('bank').value) q.set('prefill_'+Q.bank, $('bank').value);
  if ($('payer').value) q.set('prefill_'+Q.payer, $('payer').value);
  location.href = FORM + '?' + q.toString().replace(/\+/g,'%20');
});
$('again').addEventListener('click', () => { $('cam').value=''; $('cam').click(); });
</script>
</body>
</html>
